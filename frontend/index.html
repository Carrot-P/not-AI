<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文本编辑器</title>
  <style>
    body { margin: 0; }
    textarea {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 100vh;
      padding: 12px;
      border: 0;
      outline: 0;
      resize: none;
      font: 16px/1.5 monospace;
    }
  </style>
</head>
<body>
  <textarea aria-label="文本编辑区" autofocus spellcheck="false"></textarea>
</body>
</html>
